name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: forge fmt
        working-directory: contracts
        run: forge fmt --check

      # forge build + regenerate ABIs/deployments for the keeper
      - run: pnpm build

      - name: forge test
        run: pnpm test -- -vvv

      - name: keeper imports resolve against generated ABIs
        run: node -e 'import("@vol-fee-hook/contracts").then(m => { for (const f of ["setFee","feeFor","feeState","keeper","minFee","maxFee"]) if (!m.volFeeHookAbi.some(x => x.name === f)) throw new Error("missing " + f) })'
        working-directory: keeper
