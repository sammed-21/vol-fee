name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: forge fmt
        working-directory: contracts
        run: forge fmt --check && cd algebra && forge fmt --check

      # forge build (v4 + algebra) + regenerate ABIs/deployments for the keeper
      - run: pnpm build

      - name: forge test
        run: pnpm test -- -vvv

      - name: keeper imports resolve against generated ABIs
        run: |
          node -e 'import("@vol-fee-hook/contracts").then(m => {
            const need = { volFeeHookAbi: ["setFee","feeFor","feeState","keeper","minFee","maxFee"],
                           keeperFeePluginAbi: ["setFee","feeFor","feeState","factory"],
                           keeperFeePluginFactoryAbi: ["keeper","bounds"], algebraPoolAbi: ["globalState","plugin"] };
            for (const [abi, fns] of Object.entries(need)) for (const f of fns)
              if (!m[abi].some(x => x.name === f)) throw new Error(abi + " missing " + f) })'
        working-directory: keeper
